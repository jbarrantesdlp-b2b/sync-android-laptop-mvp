name: ⚡ Sync Engine - Autonomous Build & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build and Deploy Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - name: ⚙️ Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew
      - name: 🔨 Build Android APK
        run: ./gradlew assembleRelease
      - name: 🚀 Upload APK to Google Drive
        uses: adityak74/google-drive-upload-git-action@v1.0.1
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: app/build/outputs/apk/release/*.apk
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: "true"

  build-desktop:
    name: Build and Deploy Windows Desktop Daemon
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: 📦 Install Dependencies
        run: npm install
      - name: 🔨 Build Windows Executable
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 🚀 Upload EXE to Google Drive
        uses: adityak74/google-drive-upload-git-action@v1.0.1
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: dist/*.exe
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: "true"
