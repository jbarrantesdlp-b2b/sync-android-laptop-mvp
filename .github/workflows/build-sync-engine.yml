name: ⚡ Sync Engine - Autonomous Build & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # COMPILAR ANDROID Y SUBIR A DRIVE
  build-android:
    name: Build and Deploy Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleRelease
      - uses: adityak74/google-drive-upload-git-action@v0.3
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: app/build/outputs/apk/release/*.apk
          folderId: ${{ secrets.GDRIVE_FOLDER_ID || '1m8KTvhcbXy-w4Suwbwk7m2F4FuobF3uXbcyMTSqTXbg' }}
          overwrite: "true"
      - name: 🔔 Enviar Notificación Push (Android APK Listo)
        run: |
          curl --header "Access-Token: ${{ secrets.PUSHBULLET_TOKEN }}" \
               --header "Content-Type: application/json" \
               --data-binary '{"active": true, "type": "note", "title": "⚡ Sync Engine (Android APK)", "body": "¡Compilación y despliegue completado! APK subido exitosamente a Google Drive."}' \
               --request POST \
               https://api.pushbullet.com/v2/pushes

  # COMPILAR WINDOWS Y SUBIR A DRIVE
  build-desktop:
    name: Build and Deploy Windows Desktop Daemon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: adityak74/google-drive-upload-git-action@v0.3
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: dist/*.exe
          folderId: ${{ secrets.GDRIVE_FOLDER_ID || '1m8KTvhcbXy-w4Suwbwk7m2F4FuobF3uXbcyMTSqTXbg' }}
          overwrite: "true"
      - name: 🔔 Enviar Notificación Push (Windows EXE Listo)
        run: |
          curl --header "Access-Token: ${{ secrets.PUSHBULLET_TOKEN }}" \
               --header "Content-Type: application/json" \
               --data-binary "{\"active\": true, \"type\": \"note\", \"title\": \"⚡ Sync Engine (Windows)\", \"body\": \"El servidor de escritorio se ha compilado exitosamente y ya está disponible en tu Google Drive.\"}" \
               --request POST \
               https://api.pushbullet.com/v2/pushes
