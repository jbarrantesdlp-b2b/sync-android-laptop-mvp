<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>SYNC ENGINE — icon kit</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, sans-serif;
      background: #050811; color: #E2E8F0;
    }
    header {
      padding: 28px 32px 8px; display: flex; gap: 16px; align-items: center;
    }
    header img { width: 72px; height: 72px; }
    h1 { margin: 0; letter-spacing: 3px; font-size: 22px; }
    p { margin: 4px 0 0; color: #94A3B8; font-size: 12px; letter-spacing: 1.4px; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px; padding: 24px 32px 48px;
    }
    figure {
      margin: 0; background: #0C1220; border: 1px solid #1E293B;
      border-radius: 18px; padding: 16px; text-align: center;
    }
    img {
      width: 100%; height: 140px; object-fit: contain; image-rendering: auto;
      background: #050811; border-radius: 12px;
    }
    figcaption {
      margin-top: 10px; font-size: 11px; letter-spacing: .4px; color: #7DD3FC;
    }
  </style>
</head>
<body>
  <header>
    <img src="mark-512.png" alt="mark"/>
    <div>
      <h1>SYNC ENGINE</h1>
      <p>BY BARRANTES CO. · kit de iconos</p>
    </div>
  </header>
  <section class="grid"><figure><img src="mark-48.png" alt="mark 48×48"><figcaption>mark 48×48</figcaption></figure>
<figure><img src="mark-96.png" alt="mark 96×96"><figcaption>mark 96×96</figcaption></figure>
<figure><img src="mark-192.png" alt="mark 192×192"><figcaption>mark 192×192</figcaption></figure>
<figure><img src="mark-512.png" alt="mark 512×512"><figcaption>mark 512×512</figcaption></figure>
<figure><img src="mark-1024.png" alt="mark 1024×1024"><figcaption>mark 1024×1024</figcaption></figure>
<figure><img src="lockup-1024.png" alt="lockup 1024"><figcaption>lockup 1024</figcaption></figure>
<figure><img src="lockup-512.png" alt="lockup 512"><figcaption>lockup 512</figcaption></figure>
<figure><img src="maskable-512.png" alt="maskable 512"><figcaption>maskable 512</figcaption></figure>
<figure><img src="mono-silhouette-512.png" alt="mono silhouette"><figcaption>mono silhouette</figcaption></figure></section>
</body>
</html>
