<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad2)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>

  <!-- Minimalist Mountain Silhouette (Reference Image 2 COUTES Style) -->
  <path d="M 60,380 L 210,190 L 300,280 L 452,380 Z" fill="#1E293B" opacity="0.6"/>

  <!-- Glowing Solar Pulse Badge -->
  <circle cx="390" cy="150" r="36" fill="url(#goldGrad)" filter="url(#glow2)"/>

  <!-- Primary Wave Curve (Reference Image 2 Style) -->
  <path d="M 60,320 C 160,200 320,400 452,240" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.95" filter="url(#glow2)"/>
  <path d="M 60,370 C 180,270 300,420 452,310" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
</svg>
