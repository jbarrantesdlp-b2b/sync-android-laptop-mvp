<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SYNC ENGINE — By Barrantes Co.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 108 108" width="36" height="36" fill="none">
            <defs>
              <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="40%" stop-color="#94A3B8"/>
                <stop offset="100%" stop-color="#334155"/>
              </linearGradient>
              <linearGradient id="plasma" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00F0FF"/>
                <stop offset="50%" stop-color="#00BFFF"/>
                <stop offset="100%" stop-color="#8000FF"/>
              </linearGradient>
            </defs>
            <path d="M 38,28 C 58,28 62,38 58,46 L 48,64 C 40,78 56,86 70,86 C 88,86 96,68 82,50 C 70,32 50,28 38,28 Z"
                  stroke="url(#metal)" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>
            <path d="M 38,28 C 58,28 62,38 58,46 L 48,64 C 40,78 56,86 70,86 C 88,86 96,68 82,50 C 70,32 50,28 38,28 Z"
                  stroke="url(#plasma)" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
          </svg>
        </div>
        <div>
          <h1>SYNC ENGINE</h1>
          <p>BY BARRANTES CO. · Controlar. Conectar. Avanzar.</p>
        </div>
      </div>
      <div id="status-pill" class="status-pill disconnected">
        <span class="status-dot"></span>
        <span id="status-text">Desconectado</span>
      </div>
    </header>

    <section class="hero-widget">
      <div class="clock-col">
        <div class="mark big">
          <svg viewBox="0 0 108 108" width="72" height="72" fill="none">
            <defs>
              <linearGradient id="plasma2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00F0FF"/>
                <stop offset="50%" stop-color="#00BFFF"/>
                <stop offset="100%" stop-color="#8000FF"/>
              </linearGradient>
            </defs>
            <path d="M 38,28 C 58,28 62,38 58,46 L 48,64 C 40,78 56,86 70,86 C 88,86 96,68 82,50 C 70,32 50,28 38,28 Z"
                  stroke="url(#plasma2)" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
          </svg>
        </div>
        <div>
          <div id="live-date" class="date">Martes, 15 de septiembre</div>
          <div id="live-clock" class="clock">9:41</div>
        </div>
      </div>
      <div class="device-col">
        <div class="device-name" id="device-name">Buscando celular…</div>
        <div class="device-meta"><span id="server-url">Cargando…</span></div>
      </div>
      <div class="hero-actions">
        <button id="lock-btn" class="icon-btn" title="Bloquear PC">🔒</button>
        <button id="send-clipboard-btn" class="icon-btn" title="Enviar al celular">⎘</button>
        <button id="clear-log-btn" class="icon-btn" title="Limpiar log">↻</button>
      </div>
    </section>

    <div class="grid">
      <div class="card">
        <h2>Vinculación</h2>
        <p class="hint">Escanea este QR con Sync Engine en el teléfono.</p>
        <div class="qr-container">
          <canvas id="qr-canvas"></canvas>
        </div>
      </div>
      <div class="card">
        <h2>Portapapeles hacia el celular</h2>
        <div class="quick-actions">
          <input type="text" id="clipboard-input" placeholder="Texto o URL para enviar…" />
        </div>
        <div class="terminal-box">
          <div class="terminal-header">Registro en vivo</div>
          <div id="log-content" class="log-content"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
